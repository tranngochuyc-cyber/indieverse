services:
  web:
    build: .
    restart: unless-stopped
    environment:
      PUBLIC_ORIGIN: https://${DOMAIN:?Set DOMAIN in .env}
    volumes:
      - indieverse_data:/data
    networks: [indieverse]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL in .env}
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [indieverse]
    depends_on:
      web:
        condition: service_healthy
volumes:
  indieverse_data:
  caddy_data:
  caddy_config:
networks:
  indieverse:
